name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  runtime-archive:
    name: Runtime archive
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      artifact-name: ${{ steps.archive.outputs.artifact-name }}
      archive-sha256: ${{ steps.archive.outputs.archive-sha256 }}
      lane: ${{ steps.archive.outputs.lane }}
      pr-base-sha: ${{ steps.archive.outputs.pr-base-sha }}
      pr-head-sha: ${{ steps.archive.outputs.pr-head-sha }}
      pr-number: ${{ steps.archive.outputs.pr-number }}
      source-commit: ${{ steps.archive.outputs.source-commit }}
      version: ${{ steps.archive.outputs.version }}
    steps:
      - name: Check out exact Quality revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Build and verify exact runtime archive
        id: archive
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAN_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          source_commit="$RAN_SOURCE_SHA"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$source_commit"

          release_branch='release-please--branches--main--components--ran-booster-bitbucket'
          lane=full
          pr_number=0
          pr_base_sha=''
          pr_head_sha=''

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF_NAME" == "$release_branch" ]]; then
            owner="${GITHUB_REPOSITORY%%/*}"
            pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&head=${owner}%3A${release_branch}")"
            pr_json="$(jq -cer \
              --arg bot 'github-actions[bot]' \
              --arg head "$release_branch" \
              --arg repository "$GITHUB_REPOSITORY" \
              '[.[] | select(
                .state == "open"
                and .merged_at == null
                and .base.ref == "main"
                and .head.ref == $head
                and .head.repo.full_name == $repository
                and .user.login == $bot
              )]
              | if length == 1 then .[0] else error("Expected exactly one canonical Release Please candidate.") end' \
              <<< "$pr_json")"
            pr_number="$(jq -er '.number' <<< "$pr_json")"
            pr_base_sha="$(jq -er '.base.sha' <<< "$pr_json")"
            pr_head_sha="$(jq -er '.head.sha' <<< "$pr_json")"
            test "$source_commit" = "$pr_head_sha"
            bash scripts/validate-release-candidate.sh "$pr_base_sha" "$pr_head_sha"
            lane=release-candidate
          elif [[ "$GITHUB_EVENT_NAME" == pull_request \
            && "${{ github.event.pull_request.user.login }}" == 'github-actions[bot]' \
            && "${{ github.event.pull_request.base.ref }}" == main \
            && "${{ github.event.pull_request.head.ref }}" == "$release_branch" \
            && "${{ github.event.pull_request.head.repo.full_name }}" == "$GITHUB_REPOSITORY" ]]; then
            pr_number='${{ github.event.pull_request.number }}'
            pr_base_sha='${{ github.event.pull_request.base.sha }}'
            pr_head_sha='${{ github.event.pull_request.head.sha }}'
            test "$source_commit" = "$pr_head_sha"
            bash scripts/validate-release-candidate.sh "$pr_base_sha" "$pr_head_sha"
            lane=release-candidate
          fi

          version="$(sed -nE 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*([^[:space:]]+).*/\1/p' ran-booster-bitbucket.php)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(jq -er '."."' .release-please-manifest.json)" = "$version"
          test "$(sed -nE 's/^Stable tag:[[:space:]]*([^[:space:]]+).*/\1/p' readme.txt)" = "$version"

          composer build:release -- "$source_commit"
          archive="build/ran-booster-bitbucket-${version}.zip"
          checksum="${archive}.sha256"
          composer verify:release -- "$archive" "$source_commit"
          archive_sha256="$(sha256sum "$archive" | awk '{ print $1 }')"
          checksum_sha256="$(sha256sum "$checksum" | awk '{ print $1 }')"
          test "$(< "$checksum")" = "$(printf '%s  %s' "$archive_sha256" "$(basename "$archive")")"
          artifact_name="ran-booster-bitbucket-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          jq -n \
            --arg lane "$lane" \
            --arg quality_commit "$source_commit" \
            --arg source_commit "$source_commit" \
            --arg version "$version" \
            --arg sha256 "$archive_sha256" \
            --argjson pr_number "$pr_number" \
            --arg pr_base_sha "$pr_base_sha" \
            --arg pr_head_sha "$pr_head_sha" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              schema: "ran-booster-bitbucket-ci-runtime",
              schema_version: 3,
              mode: "built",
              lane: $lane,
              quality_commit: $quality_commit,
              source_commit: $source_commit,
              version: $version,
              sha256: $sha256,
              run: {id: $run_id, attempt: $run_attempt, event: env.GITHUB_EVENT_NAME},
              pull_request: {number: $pr_number, base_sha: $pr_base_sha, head_sha: $pr_head_sha}
            }' > build/ran-booster-bitbucket-ci-runtime.json

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg quality_commit "$source_commit" \
            --arg source_commit "$source_commit" \
            --arg tag "v${version}" \
            --arg archive_name "$(basename "$archive")" \
            --arg archive_sha256 "$archive_sha256" \
            --arg checksum_name "$(basename "$checksum")" \
            --arg checksum_sha256 "$checksum_sha256" \
            '{
              schema: "ran-profile-b-promotion",
              schema_version: 1,
              repository: $repository,
              quality_commit: $quality_commit,
              source_commit: $source_commit,
              tag: $tag,
              assets: [
                {name: $archive_name, sha256: $archive_sha256},
                {name: $checksum_name, sha256: $checksum_sha256}
              ]
            }' > build/ran-profile-b-promotion.json

          {
            printf 'artifact-name=%s\n' "$artifact_name"
            printf 'archive-sha256=%s\n' "$archive_sha256"
            printf 'lane=%s\n' "$lane"
            printf 'pr-base-sha=%s\n' "$pr_base_sha"
            printf 'pr-head-sha=%s\n' "$pr_head_sha"
            printf 'pr-number=%s\n' "$pr_number"
            printf 'source-commit=%s\n' "$source_commit"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"

      - name: Upload verified runtime evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.archive.outputs.artifact-name }}
          path: |
            build/ran-booster-bitbucket-${{ steps.archive.outputs.version }}.zip
            build/ran-booster-bitbucket-${{ steps.archive.outputs.version }}.zip.sha256
            build/ran-booster-bitbucket-ci-runtime.json
            build/ran-profile-b-promotion.json
          if-no-files-found: error
          retention-days: 7

  baseline:
    name: Shared PHP quality
    uses: RocketsAreNostalgic/.github/.github/workflows/quality-php-library-v2.yml@788f783d2998994f7aab9691710911ed1bd762c9
    with:
      php-floor: '8.2'
      php-current: '8.5'
      php-extensions: zip
      node-version: ''

  repository-quality:
    name: Repository quality
    needs: runtime-archive
    if: ${{ needs.runtime-archive.outputs.lane == 'full' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    env:
      RAN_BOOSTER_CORE_PATH: ${{ github.workspace }}/ran-booster
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ran-booster-bitbucket
          fetch-depth: 0
          persist-credentials: false
      - name: Read canonical Core certification
        working-directory: ran-booster-bitbucket
        run: |
          core_tag="$(jq -er '.extra["ran-booster-core-certification"].tag | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$"))' composer.json)"
          core_commit="$(jq -er '.extra["ran-booster-core-certification"].commit | select(test("^[0-9a-f]{40}$"))' composer.json)"
          printf 'RAN_BOOSTER_CORE_TAG=%s\nRAN_BOOSTER_CORE_REF=%s\n' "$core_tag" "$core_commit" >> "$GITHUB_ENV"
      - name: Check out compatible Booster Core
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: RocketsAreNostalgic/ran-booster
          path: ran-booster
          ref: ${{ env.RAN_BOOSTER_CORE_REF }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact tag-backed Core commit
        working-directory: ran-booster
        run: |
          test "$(git rev-parse HEAD)" = "$RAN_BOOSTER_CORE_REF"
          core_tag="$(git describe --tags --exact-match HEAD)"
          test "$core_tag" = "$RAN_BOOSTER_CORE_TAG"
          [[ "$core_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test -f autoload.php
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2
      - name: Install certified Core production dependencies
        working-directory: ran-booster
        run: |
          composer install --no-dev --no-interaction --prefer-dist --no-progress
          core_vendor_autoload="$PWD/vendor/autoload.php"
          test -f "$core_vendor_autoload"
          printf 'RAN_BOOSTER_CORE_VENDOR_AUTOLOAD=%s\n' "$core_vendor_autoload" >> "$GITHUB_ENV"
      - name: Install add-on development dependencies
        working-directory: ran-booster-bitbucket
        run: |
          composer validate --strict --no-check-all --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
      - name: Run repository-specific quality checks
        working-directory: ran-booster-bitbucket
        run: composer check:repository
      - name: Run static analysis pilot
        continue-on-error: true
        working-directory: ran-booster-bitbucket
        run: composer analyse
      - name: Download verified runtime archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.runtime-archive.outputs.artifact-name }}
          path: ran-booster-bitbucket/build
      - name: Verify shared runtime archive identity
        working-directory: ran-booster-bitbucket
        shell: bash
        run: |
          set -euo pipefail
          metadata='build/ran-booster-bitbucket-ci-runtime.json'
          archive='build/ran-booster-bitbucket-${{ needs.runtime-archive.outputs.version }}.zip'
          checksum="${archive}.sha256"
          test -f "$metadata"
          test -f "$archive"
          test -f "$checksum"
          jq -e \
            --arg quality_commit "$GITHUB_SHA" \
            --arg source_commit '${{ needs.runtime-archive.outputs.source-commit }}' \
            --arg version '${{ needs.runtime-archive.outputs.version }}' \
            --arg sha256 '${{ needs.runtime-archive.outputs.archive-sha256 }}' \
            '.schema == "ran-booster-bitbucket-ci-runtime"
              and .schema_version == 3
              and .mode == "built"
              and .lane == "full"
              and .quality_commit == $quality_commit
              and .source_commit == $source_commit
              and .version == $version
              and .sha256 == $sha256' \
            "$metadata" >/dev/null
          printf '%s  %s\n' '${{ needs.runtime-archive.outputs.archive-sha256 }}' "$archive" | sha256sum --check --strict
          test "$(< "$checksum")" = "$(printf '%s  %s' '${{ needs.runtime-archive.outputs.archive-sha256 }}' "$(basename "$archive")")"
          composer verify:release -- "$archive" '${{ needs.runtime-archive.outputs.source-commit }}'

  release-candidate-install:
    name: Release candidate install readback
    needs: runtime-archive
    if: ${{ needs.runtime-archive.outputs.lane == 'release-candidate' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.2"
          coverage: none
          extensions: mysqli, zip
          tools: wp-cli
      - name: Download verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.runtime-archive.outputs.artifact-name }}
          path: build
      - name: Verify release-candidate provenance
        shell: bash
        run: |
          set -euo pipefail
          metadata='build/ran-booster-bitbucket-ci-runtime.json'
          archive='build/ran-booster-bitbucket-${{ needs.runtime-archive.outputs.version }}.zip'
          jq -e \
            --arg source_commit '${{ needs.runtime-archive.outputs.pr-head-sha }}' \
            --arg version '${{ needs.runtime-archive.outputs.version }}' \
            --argjson pr_number '${{ needs.runtime-archive.outputs.pr-number }}' \
            '.schema == "ran-booster-bitbucket-ci-runtime"
              and .schema_version == 3
              and .mode == "built"
              and .lane == "release-candidate"
              and .source_commit == $source_commit
              and .version == $version
              and .pull_request.number == $pr_number
              and .pull_request.head_sha == $source_commit
              and .run.id == (env.GITHUB_RUN_ID | tonumber)
              and .run.attempt == (env.GITHUB_RUN_ATTEMPT | tonumber)
              and (
                (.run.event == "workflow_dispatch" and .quality_commit == $source_commit)
                or
                (.run.event == "pull_request" and .pull_request.tested_commit == .quality_commit and .pull_request.tested_tree == .source_tree)
              )' \
            "$metadata" >/dev/null
          printf '%s  %s\n' '${{ needs.runtime-archive.outputs.archive-sha256 }}' "$archive" | sha256sum --check --strict
          unzip -tqq "$archive"
      - name: Install WordPress 7.0.3
        run: |
          wp core download --path=build/wordpress --version=7.0.3
          test "$(wp core version --path=build/wordpress)" = '7.0.3'
          wp config create --path=build/wordpress --dbname=wordpress_test --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306
          wp core install --path=build/wordpress --url=http://localhost --title='RAN Booster Bitbucket CI' --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email
      - name: Install candidate without activating its Core dependency
        run: |
          wp plugin install "$GITHUB_WORKSPACE/build/ran-booster-bitbucket-${{ needs.runtime-archive.outputs.version }}.zip" --path=build/wordpress
          wp plugin is-installed ran-booster-bitbucket --path=build/wordpress
          ! wp plugin is-active ran-booster-bitbucket --path=build/wordpress
      - name: Read back installed candidate identity and bytes
        shell: bash
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/build/ran-booster-bitbucket-${{ needs.runtime-archive.outputs.version }}.zip"
          plugin_root="$GITHUB_WORKSPACE/build/wordpress/wp-content/plugins/ran-booster-bitbucket"
          expected_root="$RUNNER_TEMP/ran-booster-bitbucket-installed-readback"
          test "$(wp plugin get ran-booster-bitbucket --field=version --path=build/wordpress)" = '${{ needs.runtime-archive.outputs.version }}'
          # The PHP expression is intentionally passed literally to WP-CLI.
          # shellcheck disable=SC2016
          wp eval '
            require_once ABSPATH . "wp-admin/includes/plugin.php";
            $data = get_plugin_data( WP_PLUGIN_DIR . "/ran-booster-bitbucket/ran-booster-bitbucket.php", false, false );
            if ( "https://github.com/RocketsAreNostalgic/ran-booster-bitbucket" !== ( $data["UpdateURI"] ?? null )
              || "ran-booster" !== ( $data["RequiresPlugins"] ?? null ) ) {
              throw new RuntimeException( "Installed candidate headers are inconsistent." );
            }
          ' --path=build/wordpress
          mkdir -p "$expected_root"
          unzip -q "$archive" -d "$expected_root"
          diff -qr "$expected_root/ran-booster-bitbucket" "$plugin_root"

  quality:
    name: Quality
    if: ${{ always() }}
    needs:
      - runtime-archive
      - baseline
      - repository-quality
      - release-candidate-install
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Require applicable shared and repository quality evidence
        shell: bash
        env:
          LANE: ${{ needs.runtime-archive.outputs.lane }}
          RUNTIME_ARCHIVE_RESULT: ${{ needs.runtime-archive.result }}
          BASELINE_RESULT: ${{ needs.baseline.result }}
          REPOSITORY_QUALITY_RESULT: ${{ needs.repository-quality.result }}
          RELEASE_CANDIDATE_INSTALL_RESULT: ${{ needs.release-candidate-install.result }}
        run: |
          set -euo pipefail
          printf 'archive=%s baseline=%s repository=%s release-candidate=%s lane=%s\n' \
            "$RUNTIME_ARCHIVE_RESULT" "$BASELINE_RESULT" "$REPOSITORY_QUALITY_RESULT" \
            "$RELEASE_CANDIDATE_INSTALL_RESULT" "$LANE"
          test "$RUNTIME_ARCHIVE_RESULT" = success
          test "$BASELINE_RESULT" = success

          if [[ "$LANE" == full ]]; then
            test "$REPOSITORY_QUALITY_RESULT" = success
            test "$RELEASE_CANDIDATE_INSTALL_RESULT" = skipped
          elif [[ "$LANE" == release-candidate ]]; then
            test "$REPOSITORY_QUALITY_RESULT" = skipped
            test "$RELEASE_CANDIDATE_INSTALL_RESULT" = success
          else
            echo "Unsupported quality lane: $LANE" >&2
            exit 1
          fi
