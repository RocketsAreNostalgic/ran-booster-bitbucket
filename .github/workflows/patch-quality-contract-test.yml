name: Patch quality contract test

on:
  push:
    branches:
      - ci/adopt-php-quality-v2

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out migration branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ci/adopt-php-quality-v2
          fetch-depth: 0

      - name: Update Composer quality split contract
        shell: bash
        run: |
          set -euo pipefail
          file='tests/Plugin/CoreContractTest.php'
          sed -i 's/testReleaseCandidateValidatorBehaviorIsPartOfComposerCheck/testReleaseCandidateValidatorBehaviorIsPartOfRepositoryComposerCheck/' "$file"
          sed -i "s/contains( '@test:release-candidate', \\$composer\['scripts'\]\['check'\]/contains( '@test:release-candidate', \\$composer['scripts']['check:repository']/" "$file"
          sed -i "s/contains( '@test:release-marker', \\$composer\['scripts'\]\['check'\]/contains( '@test:release-marker', \\$composer['scripts']['check:repository']/" "$file"
          sed -i "s/contains( '@test:release-state', \\$composer\['scripts'\]\['check'\]/contains( '@test:release-state', \\$composer['scripts']['check:repository']/" "$file"
          grep -F 'testReleaseCandidateValidatorBehaviorIsPartOfRepositoryComposerCheck' "$file"
          test "$(grep -F "['scripts']['check:repository']" "$file" | wc -l)" -ge 3

      - name: Commit contract test only
        shell: bash
        run: |
          set -euo pipefail
          git add tests/Plugin/CoreContractTest.php
          test "$(git diff --cached --name-only)" = 'tests/Plugin/CoreContractTest.php'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: encode shared and repository quality split'
          git push origin HEAD:ci/adopt-php-quality-v2
