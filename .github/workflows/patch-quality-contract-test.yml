name: Patch quality contract test

on:
  push:
    branches:
      - ci/adopt-php-quality-v2

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out migration branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ci/adopt-php-quality-v2
          fetch-depth: 0

      - name: Update Composer quality split contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/Plugin/CoreContractTest.php')
          text = path.read_text()
          old_name = 'testReleaseCandidateValidatorBehaviorIsPartOfComposerCheck'
          new_name = 'testReleaseCandidateValidatorBehaviorIsPartOfRepositoryComposerCheck'
          if text.count(old_name) != 1:
              raise SystemExit('Expected exactly one legacy test name.')
          text = text.replace(old_name, new_name, 1)
          for script in ('release-candidate', 'release-marker', 'release-state'):
              old = f"self::assertContains( '@test:{script}', $composer['scripts']['check'] ?? array() );"
              new = f"self::assertContains( '@test:{script}', $composer['scripts']['check:repository'] ?? array() );"
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one {script} legacy check assertion.')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          grep -F 'testReleaseCandidateValidatorBehaviorIsPartOfRepositoryComposerCheck' tests/Plugin/CoreContractTest.php
          test "$(grep -F "['scripts']['check:repository']" tests/Plugin/CoreContractTest.php | wc -l)" -ge 3

      - name: Commit contract test only
        shell: bash
        run: |
          set -euo pipefail
          git add tests/Plugin/CoreContractTest.php
          test "$(git diff --cached --name-only)" = 'tests/Plugin/CoreContractTest.php'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: encode shared and repository quality split'
          git push origin HEAD:ci/adopt-php-quality-v2
