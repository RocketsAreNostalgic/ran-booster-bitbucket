name: Release Please

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Open or update the release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  package-release:
    name: Package release
    needs: release-please
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    env:
      RAN_BOOSTER_CORE_PATH: ${{ github.workspace }}/ran-booster
    steps:
      - name: Check out the release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: ran-booster-bitbucket
          persist-credentials: false
          fetch-depth: 0

      - name: Identify a merged Release Please version
        working-directory: ran-booster-bitbucket
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(jq -er '."." | select(type == "string")' .release-please-manifest.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          tag="v${version}"
          if release_json="$(gh release view "$tag" --json isDraft,isImmutable,targetCommitish 2>&1)"; then
            if [[ "$(jq -er '.isDraft' <<< "$release_json")" == false ]]; then
              if [[ "$(jq -er '.isImmutable' <<< "$release_json")" == true ]]; then exit 0; fi
              echo '::error::The published release is not immutable and cannot be accepted.'
              exit 1
            fi
            state=draft
          elif [[ "$release_json" == *'(HTTP 404)'* ]]; then
            state=absent
          else
            printf '%s\n' "$release_json" >&2
            exit 1
          fi
          if [[ "$state" == absent ]] && git diff --quiet HEAD^ HEAD -- .release-please-manifest.json; then exit 0; fi
          release_commit="$(git log -1 --format=%H -- .release-please-manifest.json)"
          test "$(git show "${release_commit}:.release-please-manifest.json" | jq -er '."."')" = "$version"
          if [[ "$state" == draft ]]; then
            test "$(jq -er '.targetCommitish' <<< "$release_json")" = "$release_commit"
          fi
          printf 'RAN_RELEASE_VERSION=%s\nRAN_RELEASE_TAG=%s\nRAN_RELEASE_COMMIT=%s\nRAN_RELEASE_STATE=%s\nRAN_RELEASE_PENDING=true\n' "$version" "$tag" "$release_commit" "$state" >> "$GITHUB_ENV"

      - name: Check out the exact release source
        if: env.RAN_RELEASE_PENDING == 'true'
        working-directory: ran-booster-bitbucket
        run: git checkout --detach "${RAN_RELEASE_COMMIT}"

      - name: Require private Core read-only deploy key
        if: env.RAN_RELEASE_PENDING == 'true'
        env:
          CORE_READ_SSH_KEY: ${{ secrets.RAN_BOOSTER_CORE_READ_SSH_KEY }}
        run: |
          if [ -z "${CORE_READ_SSH_KEY:-}" ]; then
              echo "::error::RAN_BOOSTER_CORE_READ_SSH_KEY is required to checkout the private ran-booster repository."
              exit 1
          fi

      - name: Check out released Booster Core
        if: env.RAN_RELEASE_PENDING == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: RocketsAreNostalgic/ran-booster
          # Provider API 8 / Add-on API 14 compatibility baseline.
          ref: 6cca933ea349367c1486c0cf163ea3f9fa082887
          path: ran-booster
          fetch-depth: 0
          persist-credentials: false
          ssh-key: ${{ secrets.RAN_BOOSTER_CORE_READ_SSH_KEY }}

      - name: Confirm tag-backed Booster Core
        if: env.RAN_RELEASE_PENDING == 'true'
        working-directory: ran-booster
        run: |
          core_tag="$(git describe --tags --exact-match HEAD)"
          [[ "${core_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]

      - name: Set up PHP
        if: env.RAN_RELEASE_PENDING == 'true'
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.36.0
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2

      - name: Install Core development dependencies
        if: env.RAN_RELEASE_PENDING == 'true'
        working-directory: ran-booster
        run: |
          composer validate --strict --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress

      - name: Test, build and verify release assets
        if: env.RAN_RELEASE_PENDING == 'true'
        working-directory: ran-booster-bitbucket
        run: |
          set -euo pipefail
          version="${RAN_RELEASE_VERSION}"
          test "$(git rev-parse HEAD)" = "${RAN_RELEASE_COMMIT}"
          test "$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*\([^[:space:]]*\)[[:space:]]*$/\1/p' ran-booster-bitbucket.php)" = "${version}"
          composer validate --strict --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
          composer check
          composer build:release

      - name: Create or reuse the draft and attach verified assets
        if: env.RAN_RELEASE_PENDING == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ran-booster-bitbucket
        run: |
          set -euo pipefail
          if [[ "${RAN_RELEASE_STATE}" == absent ]]; then
              prerelease=()
              [[ "${RAN_RELEASE_VERSION}" == *-* ]] && prerelease=(--prerelease)
              gh release create "${RAN_RELEASE_TAG}" --draft --target "${RAN_RELEASE_COMMIT}" --title "${RAN_RELEASE_TAG}" --generate-notes "${prerelease[@]}"
          fi
          gh release upload "${RAN_RELEASE_TAG}" \
              "build/ran-booster-bitbucket-${RAN_RELEASE_VERSION}.zip" \
              "build/ran-booster-bitbucket-${RAN_RELEASE_VERSION}.zip.sha256" \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
          remote="$(mktemp -d)"
          trap 'rm -rf "$remote"' EXIT
          gh release download "${RAN_RELEASE_TAG}" --dir "$remote" --pattern "ran-booster-bitbucket-${RAN_RELEASE_VERSION}.zip*"
          cmp -s "build/ran-booster-bitbucket-${RAN_RELEASE_VERSION}.zip" "$remote/ran-booster-bitbucket-${RAN_RELEASE_VERSION}.zip"
          cmp -s "build/ran-booster-bitbucket-${RAN_RELEASE_VERSION}.zip.sha256" "$remote/ran-booster-bitbucket-${RAN_RELEASE_VERSION}.zip.sha256"

      - name: Publish only under the immutable-release contract
        if: env.RAN_RELEASE_PENDING == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMMUTABLE_RELEASES_ENABLED: ${{ vars.RAN_IMMUTABLE_RELEASES_ENABLED }}
        run: |
          set -euo pipefail
          if [[ "${IMMUTABLE_RELEASES_ENABLED}" != true ]]; then
              echo '::error::Enable GitHub immutable releases and set RAN_IMMUTABLE_RELEASES_ENABLED=true. The verified release remains a draft.'
              exit 1
          fi
          latest=(--latest)
          [[ "${RAN_RELEASE_VERSION}" == *-* ]] && latest=(--prerelease)
          gh release edit "${RAN_RELEASE_TAG}" --draft=false "${latest[@]}"
          immutable=false
          for delay in 0 2 2 2 2; do
            sleep "$delay"
            if immutable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RAN_RELEASE_TAG}" --jq '.immutable' 2>/dev/null)" \
              && [[ "$immutable" == true ]]; then break; fi
          done
          test "$immutable" = true
