name: Release Please

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  certified-core:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.path == '.github/workflows/quality.yml' &&
      github.event.workflow_run.head_repository.id == github.repository_id &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
    uses: ./.github/workflows/installed-proof.yml
    with:
      source-sha: ${{ github.event.workflow_run.head_sha }}

  release:
    needs: certified-core
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    uses: RocketsAreNostalgic/.github/.github/workflows/release-profile-b.yml@e2fb19244a301a62f8fae2a80536898adf21fe22
    with:
      expected-workflow-path: .github/workflows/quality.yml
      release-pr-head: release-please--branches--main--components--ran-booster-bitbucket
      artifact-prefix: ran-booster-bitbucket-runtime
