name: Release Please

on:
    push:
        branches:
            - main

permissions: {}

concurrency:
    group: release-please-main
    cancel-in-progress: false

jobs:
    release-please:
        name: Release Please
        runs-on: ubuntu-24.04
        permissions:
            contents: write
            issues: write
            pull-requests: write
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - name: Open or update the release pull request
              id: release
              uses: googleapis/release-please-action@v5.0.0
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    package-release:
        name: Package release
        needs: release-please
        if: needs.release-please.outputs.release_created == 'true'
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        env:
            RAN_BOOSTER_CORE_PATH: ${{ github.workspace }}/ran-booster
            TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        steps:
            - name: Require private Core read-only deploy key
              env:
                  CORE_READ_SSH_KEY: ${{ secrets.RAN_BOOSTER_CORE_READ_SSH_KEY }}
              run: |
                  if [ -z "${CORE_READ_SSH_KEY:-}" ]; then
                      echo "::error::RAN_BOOSTER_CORE_READ_SSH_KEY is required to checkout the private ran-booster repository."
                      exit 1
                  fi

            - name: Check out the add-on release tag
              uses: actions/checkout@v6.0.2
              with:
                  path: ran-booster-bitbucket
                  persist-credentials: false
                  ref: ${{ env.TAG_NAME }}

            - name: Check out released Booster Core
              uses: actions/checkout@v6.0.2
              with:
                  repository: RocketsAreNostalgic/ran-booster
                  # Booster v0.1.0-alpha.22.
                  ref: 481b91a1aad9214468afc5ca9960fb559f5ceccf
                  path: ran-booster
                  persist-credentials: false
                  ssh-key: ${{ secrets.RAN_BOOSTER_CORE_READ_SSH_KEY }}

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.2'
                  coverage: none
                  tools: composer:v2

            - name: Install Core development dependencies
              working-directory: ran-booster
              run: |
                  composer validate --strict --no-check-publish
                  composer install --no-interaction --prefer-dist --no-progress

            - name: Test, build and verify release assets
              working-directory: ran-booster-bitbucket
              run: |
                  set -euo pipefail
                  version="${TAG_NAME#v}"
                  test "${TAG_NAME}" = "v${version}"
                  test "$(git describe --tags --exact-match HEAD)" = "${TAG_NAME}"
                  test "$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*\([^[:space:]]*\)[[:space:]]*$/\1/p' ran-booster-bitbucket.php)" = "${version}"
                  composer validate --strict --no-check-publish
                  composer install --no-interaction --prefer-dist --no-progress
                  composer check
                  composer build:release

            - name: Confirm prerelease and upload release assets
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              working-directory: ran-booster-bitbucket
              run: |
                  set -euo pipefail
                  version="${TAG_NAME#v}"
                  test "$(gh release view "${TAG_NAME}" \
                      --json isPrerelease \
                      --jq '.isPrerelease' \
                      --repo "${GITHUB_REPOSITORY}")" = 'true'
                  gh release upload "${TAG_NAME}" \
                      "build/ran-booster-bitbucket-${version}.zip" \
                      "build/ran-booster-bitbucket-${version}.zip.sha256" \
                      --repo "${GITHUB_REPOSITORY}"
